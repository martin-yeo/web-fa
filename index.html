<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영화 보드</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <!-- 공용 헤더: common.js가 서비스 이름과 메뉴를 채웁니다(이름은 config.js) -->
  <header id="site-header"></header>

  <main>
    <h1>지금 상영 중</h1>

    <!-- #3에서 옮겨 온 도구 막대(실습과제 #3 index.html의 툴바, 교수 참고 보드) -->
    <div class="toolbar">
      <!-- TODO 필수 2: 검색창에서 Enter를 치면 검색어로 search/movie를 다시 불러오기(지금은 글자를 칠 때마다 받은 목록 안에서만 거름, #3 그대로) -->
      <input id="q" type="search" placeholder="영화 제목 검색">
      <!-- #3의 보기 라디오(전체, 내 영화, 박스오피스)는 뺐습니다: TMDB 영화는 모두 같은 종류 -->
      <label for="sort">정렬</label>
      <!-- 최신 개봉순은 #3의 year 대신 date(개봉일)로 정렬합니다: 상영 중 영화는 거의 모두 같은 해라서 -->
      <select id="sort">
        <option value="rating">평점순</option>
        <option value="date">최신 개봉순</option>
        <option value="title">제목 가나다순</option>
      </select>
      <p><span id="count"></span>, 찜 <span id="likeCount">0</span>편</p>
      <!-- TODO 필수 5: 찜 모두 지우기 버튼 <button type="button"> 만들기 -->
    </div>

    <!-- 상태 문구(로딩, 빈 결과, 오류)는 setState가 보드 바로 위에 만들어 넣습니다 -->
    <section id="board" class="board"></section>
  </main>

  <!-- 공용 푸터: common.js가 TMDB 고지를 채웁니다. 이 페이지에 다른 자료를 쓰면 그 출처를 이 안에 한 줄 더 씁니다 -->
  <footer id="site-footer"></footer>

  <!-- 순서: 설정 ⇒ 키(keys.js의 키가 비면 샘플 모드) ⇒ 샘플 ⇒ 공용 도구 ⇒ 이 페이지 -->
  <script src="config.js"></script>
  <script src="keys.js"></script>
  <script src="sample.js"></script>
  <script src="common.js"></script>
  <script src="board.js"></script>
</body>
</html>
